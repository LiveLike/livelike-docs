  /v1/applications/{client_id}/products/:
    post:
      tags:
        - Product
      summary: Create Product
      description: Create Product
      operationId: createProduct
      requestBody:
        content:
          application/json:
            examples:
              Create Product:
                value: |-
                  {
                      "product_store_id": "1d9eee8a-2c5e-4b64-88a8-9c98ef2cb85f",
                      "name": "Badge Product",
                      "product_type": "unique_code",
                      "description": {
                          "type": "doc",
                          "content": []
                      },
                      "redemption_rules": {
                          "max_redemptions_per_user": 1,
                          "max_redemption_days": 5
                      },
                      "gating_profile_group_ids": [],
                      "category_ids": [
                          {
                              "id": "32ce79e1-c23b-4cf0-9e70-be13a933c51e"
                            
                          }
                      ],
                      "sponsor_ids": [

                      ],
                      // "start_at": "2026-08-25T00:00:00Z",
                      "expiry_at": "2026-12-31T23:59:59Z",
                      "redemption_success_message": {
                          "type": "doc",
                          "content": []
                      },
                      "redemption_failure_message": {
                          "type": "doc",
                          "content": []
                      },
                      "custom_data": "{\"sku\":\"ABC123\"}",
                      "reward_item_id": "defcec39-2af5-4cb2-9bb1-32bb817813e1"
                      
                  }
          multipart/form-data:
            schema:
              type: object
              properties:
                cost:
                  type: string
                  example: '10.00'
                image[0]display_order:
                  type: string
                  example: '0'
                image[0]image:
                  type: string
                  format: binary
                image[1]display_order:
                  type: string
                  example: '1'
                image[1]image:
                  type: string
                  format: binary
                inventory_count:
                  type: string
                  example: '5'
                name:
                  type: string
                  example: Image Product
                product_store_id:
                  type: string
                  example: 1d9eee8a-2c5e-4b64-88a8-9c98ef2cb85f
                reward_item_id:
                  type: string
                  example: 028a5d74-d587-45d5-a6e6-d802c75ba75c
