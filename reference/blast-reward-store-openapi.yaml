  /v1/applications/{client_id}/products/admin/:
    get:
      tags:
        - Product
      summary: Admin product api
      description: Admin product api
      operationId: adminProductApi
      parameters:
        - name: state
          in: query
          schema:
            type: string
            example: published
        - name: category_name
          in: query
          schema:
            type: string
            example: Apparel
        - name: category_id
          in: query
          schema:
            type: string
            example: <category-uuid>
        - name: product_store_id
          in: query
          schema:
            type: string
            example: <product-store-uuid>
        - name: sponsor_id
          in: query
          schema:
            type: string
            example: <sponsor-uuid>
        - name: product_type
          in: query
          schema:
            type: string
            example: built_in
        - name: is_gated
          in: query
          schema:
            type: string
            example: 'true'
        - name: attributes
          in: query
          schema:
            type: string
            example: season:2026
        - name: ordering
          in: query
          schema:
            type: string
            example: '-expiry_at'
        - name: page
          in: query
          schema:
            type: string
            example: '1'
        - name: page_size
          in: query
          schema:
            type: string
            example: '20'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                attributes:
                  type: string
                  example: season:2026
                category_id:
                  type: string
                  example: <category-uuid>
                category_name:
                  type: string
                  example: Apparel
                is_gated:
                  type: string
                  example: 'true'
                ordering:
                  type: string
                  example: '-expiry_at'
                page:
                  type: string
                  example: '1'
                page_size:
                  type: string
                  example: '20'
                product_store_id:
                  type: string
                  example: <product-store-uuid>
                product_type:
                  type: string
                  example: built_in
                sponsor_id:
                  type: string
                  example: <sponsor-uuid>
                state:
                  type: string
                  example: published
                status:
                  type: string
                  example: coming_soon
            examples:
              Admin product api:
                value:
                  attributes: season:2026
                  category_id: <category-uuid>
                  category_name: Apparel
                  is_gated: 'true'
                  ordering: '-expiry_at'
                  page: '1'
                  page_size: '20'
                  product_store_id: <product-store-uuid>
                  product_type: built_in
                  sponsor_id: <sponsor-uuid>
                  state: published
                  status: coming_soon
      responses:
        '200':
          description: ''
      security:
        - bearerAuth: []
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
