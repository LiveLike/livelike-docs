components:
  schemas:
    Order:
      type: object
      description: Read serializer for an order and the variant lines in it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: id
        url:
          type: string
          readOnly: true
          description: url
        profile:
          allOf:
            - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
          description: profile
        status:
          enum:
            - created
            - cancelled
          type: string
          x-spec-enum-id: e9fbbb64dc19aa0b
          readOnly: true
          description: >-
            Container status of the order; the redemption lifecycle lives on its
            items.


            * `created` - Created

            * `cancelled` - Cancelled
        reward_item:
          allOf:
            - $ref: '#/components/schemas/ProductStoreRewardItem'
          readOnly: true
          description: reward_item
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Total reward-item amount spent on this order.
        redemption_method:
          enum:
            - reward_item
            - cash
          type: string
          x-spec-enum-id: 1348fdf7abf0012a
          readOnly: true
          description: |-
            How this order was paid, snapshotted at creation.

            * `reward_item` - Reward item
            * `cash` - Cash
        idempotency_key:
          type: string
          readOnly: true
          description: >-
            Client-supplied key that prevents duplicate orders when a request is
            retried.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
          description: items
        refunds:
          type: string
          readOnly: true
          description: refunds
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Record creation timestamp
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Last update timestamp
    OrderItem:
      type: object
      description: >-
        Read serializer for one line within an order — the unit that carries the
        redemption

        lifecycle.


        A line redeems a :class:`ProductVariant`, so the variant is the primary
        nested object

        (id, label, and its effective images — the variant's own, falling back
        to the product's);

        the parent product is a small sibling object for context. ``profile`` is
        the order's owner,

        surfaced here so the store-wide order-items view can show who to fulfil
        for without a

        round-trip to the order.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: id
        order_id:
          type: string
          format: uuid
          readOnly: true
          description: order_id
        profile:
          allOf:
            - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
          description: profile
        product:
          type: string
          readOnly: true
          description: product
        variant:
          type: string
          readOnly: true
          description: variant
        redemption_method:
          type: string
          readOnly: true
          description: redemption_method
        status:
          enum:
            - in_progress
            - redeemed
            - awaiting_provider_confirmation
            - fulfilled
            - rejected
            - refunded
          type: string
          x-spec-enum-id: 5f97a1a933aa5761
          readOnly: true
          description: |-
            Current redemption status of this line.

            * `in_progress` - In progress
            * `redeemed` - Redeemed
            * `awaiting_provider_confirmation` - Awaiting provider confirmation
            * `fulfilled` - Fulfilled
            * `rejected` - Rejected
            * `refunded` - Refunded
        quantity:
          type: integer
          readOnly: true
          description: Number of units of the variant redeemed.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Reward-item amount spent on this item.
        unit_amount:
          type: string
          readOnly: true
          description: unit_amount
        failure_reason:
          type: string
          readOnly: true
          nullable: true
          description: Why this item was rejected or refunded, if it was.
        updated_by:
          allOf:
            - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
          description: updated_by
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Record creation timestamp
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Last update timestamp
        reject_url:
          type: string
          readOnly: true
          description: reject_url
        redeem_url:
          type: string
          readOnly: true
          description: redeem_url
        fulfill_url:
          type: string
          readOnly: true
          description: fulfill_url
        refund_url:
          type: string
          readOnly: true
          description: refund_url
    PaginatedOrderItemList:
