  /api/v1/applications/{client_id}/order-items/:
    get:
      operationId: applications_order_items_list_list
      description: Retrieve a list of OrderItem records.
      parameters:
        - in: query
          name: amount__gte
          schema:
            type: number
          description: Query parameter `amount__gte`.
        - in: query
          name: amount__lte
          schema:
            type: number
          description: Query parameter `amount__lte`.
        - in: path
          name: client_id
          schema:
            type: string
            pattern: ^[^/]+$
          required: true
          description: Path parameter `client_id`.
        - in: query
          name: is_refunded
          schema:
            type: boolean
          description: Query parameter `is_refunded`.
        - in: query
          name: order_id
          schema:
            type: string
            format: uuid
          description: Query parameter `order_id`.
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: product_id
          schema:
            type: string
            format: uuid
          description: Query parameter `product_id`.
        - in: query
          name: profile_id
          schema:
            type: string
            format: uuid
          description: Query parameter `profile_id`.
        - in: query
          name: redemption_method
          schema:
            type: string
            x-spec-enum-id: 1348fdf7abf0012a
            enum:
              - cash
              - reward_item
          description: |-
            How this order was paid, snapshotted at creation.

            * `reward_item` - Reward item
            * `cash` - Cash
        - in: query
          name: redemption_provider
          schema:
            type: string
            x-spec-enum-id: 07d3726d6031e8af
            nullable: true
            enum:
              - konekt
          description: >-
            Third party that redeems and fulfils this product. Null (the
            default) means we do it ourselves. Inventory is always ours
            regardless.


            * `konekt` - Konekt
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: Query parameter `since`.
        - in: query
          name: status
          schema:
            type: string
            x-spec-enum-id: 5f97a1a933aa5761
            enum:
              - awaiting_provider_confirmation
              - fulfilled
              - in_progress
              - redeemed
              - refunded
              - rejected
          description: |-
            Current redemption status of this line.

            * `in_progress` - In progress
            * `redeemed` - Redeemed
            * `awaiting_provider_confirmation` - Awaiting provider confirmation
            * `fulfilled` - Fulfilled
            * `rejected` - Rejected
            * `refunded` - Refunded
        - in: query
          name: until
          schema:
            type: string
            format: date-time
          description: Query parameter `until`.
        - in: query
          name: variant_id
          schema:
            type: string
            format: uuid
          description: Query parameter `variant_id`.
      tags:
        - applications
      security:
        - LiveLikeJWTAuthentication: []
        - ClientJWTAuthentication: []
        - ProducerAccessTokenAuthentication: []
        - SessionAuthentication: []
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderItemList'
          description: ''
    post:
      operationId: applications_order_items_create_create
      description: Create a new OrderItem record.
      parameters:
        - in: path
          name: client_id
          schema:
            type: string
            pattern: ^[^/]+$
